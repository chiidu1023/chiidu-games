 else if(deaths>=8&&deaths%3===2)s='ヒントが欲しいのですか？「'+lv.hint+'」';
 else if(deaths===1)s='あれ？ 予想外でしたか？';
 else s=pool[(deaths*7)%pool.length];
 say('作者：'+(why?why+' ':'')+s);dead=.55;beep(120,.25,'sawtooth');
 for(let i=0;i<18;i++)parts.push({x:p.x+10,y:p.y+14,vx:(Math.random()-.5)*400,vy:-Math.random()*400})}
function act(o){(o.on||[]).forEach(k=>dyn[k]=1);(o.off||[]).forEach(k=>dyn[k]=0)}
function upd(dt){
 if(mt>0)mt-=dt;
 if(dead>0){dead-=dt;parts.forEach(q=>{q.x+=q.vx*dt;q.y+=q.vy*dt;q.vy+=900*dt});if(dead<=0)reset();return}
 time+=dt;jbuf-=dt;
 const d=(RT()?1:0)-(LF()?1:0);p.vx=d*190;if(d)p.face=d;
 coy=p.gr?.08:coy-dt;
 if(jbuf>0&&coy>0){p.vy=-480;jbuf=0;coy=0;beep(520,.08)}
 p.vy=Math.min(p.vy+1400*dt,800);
 mv(p.vx*dt,0);mv(0,p.vy*dt);
 if(p.x<0)p.x=0;if(p.x>lv.w*T-p.w)p.x=lv.w*T-p.w;
 if(p.on&&p.on.fk)p.on.s=1;
 fk.forEach(f=>{if(f.s&&!f.gone){f.t-=dt;if(f.t<=0){f.gone=1;beep(90,.2,'triangle')}}if(f.gone){f.vy+=900*dt;f.y+=f.vy*dt}});
 if(p.y>H+60)return die('落ちました。');
 for(const h of spk())if(hit(p,h))return die();
 lv.tr.forEach((o,i)=>{if(!tr[i]&&hit(p,R(o.r))){tr[i]=1;act(o);beep(200,.1)}});
 lv.c.forEach((o,i)=>{if(!cs[i]&&hit(p,{x:o.x*T+8,y:o.y*T+8,w:16,h:16})){cs[i]=1;act(o);beep(900,.1);say('作者：だから言ったのに。')}});
 for(const f of lv.fg)if(hit(p,{x:f.x*T+4,y:f.y*T,w:24,h:64}))return die('それは偽物のゴールです。');
 if(hit(p,{x:lv.g[0]*T+4,y:lv.g[1]*T,w:24,h:64})){st='clear';beep(660,.2);beep(880,.3);
  const b=best[li];if(b==null||time<b){best[li]=time;try{localStorage.setItem('trustme',JSON.stringify(best))}catch(e){}cl='新記録！'}else cl='';
  nw='';const wi=WS.filter(s=>s<=li).length-1;if(wi<4&&li===WS[wi+1]-1&&unl<wi+2){unl=wi+2;best.u=unl;nw='WORLD '+unl+' 解放！';try{localStorage.setItem('trustme',JSON.stringify(best))}catch(e){}}}
}
function tx(s,x,y,sz,c,al){g.font='bold '+sz+'px "Hiragino Sans","Noto Sans JP",sans-serif';g.fillStyle=c||'#f3efe6';g.textAlign=al||'left';g.fillText(s,x,y)}
function gnd(r){g.fillStyle='#5b4636';g.fillRect(r.x,r.y,r.w,r.h);g.fillStyle='#4caf50';g.fillRect(r.x,r.y,r.w,6)}
function spikes(x,y,w,dn){g.fillStyle='#d0d4dc';for(let i=0;i<w;i++){g.beginPath();const a=(x+i)*T;
 if(dn){g.moveTo(a+2,y*T);g.lineTo(a+30,y*T);g.lineTo(a+16,y*T+T)}else{g.moveTo(a+2,y*T+T);g.lineTo(a+30,y*T+T);g.lineTo(a+16,y*T)}g.fill()}}
function door(x,y){g.fillStyle='#e0a030';g.fillRect(x*T+2,y*T,28,64);g.fillStyle='#8a5a10';g.fillRect(x*T+6,y*T+4,20,56);g.fillStyle='#ffe08a';g.fillRect(x*T+21,y*T+32,4,4)}
function share(){const text=st==='end'?'TrustMeを全ステージクリアした！ 作者を信用するか疑うか… #TrustMe':'TrustMe '+lv.n+' をクリア！ 死亡'+deaths+'回 '+time.toFixed(1)+'秒 #TrustMe',url='https://chiidu1023.github.io/chiidu-games/games/TrustMe.html';
 const fb=()=>{try{navigator.clipboard.writeText(text+' '+url)}catch(e){}try{window.open('https://twitter.com/intent/tweet?text='+encodeURIComponent(text)+'&url='+encodeURIComponent(url),'_blank')}catch(e){}};
 if(navigator.share)navigator.share({text,url}).catch(fb);else fb()}
function shareBtn(){g.fillStyle='#1d9bf0';g.fillRect(W/2-110,365,220,42);tx('SNSで共有 (S)',W/2,393,18,'#fff','center')}
function draw(){
 g.fillStyle='#1d2340';g.fillRect(0,0,W,H);
 if(st==='title'||st==='end'){tx('TrustMe',W/2,110,64,'#ffd166','center');
  if(st==='title'){['作者を信用しなければならない。しかし作者はひねくれている。','','← → / A D：移動　Space / ↑：ジャンプ　R：リスタート　Esc：ポーズ','スマホは画面下のボタンでも操作できます','','看板は本当のこともあれば、嘘のこともある。','失敗から学んで、ゴールを目指そう。','','Enter / タップでスタート'].forEach((s,i)=>tx(s,W/2,150+i*27,17,i==8?'#ffd166':'#f3efe6','center'));for(let i=0;i<5;i++){g.fillStyle=i<unl?'#2c2a44':'#1a1930';g.fillRect(i*160+4,398,152,44);tx((i<unl?'':'🔒 ')+'WORLD '+(i+1),i*160+80,426,16,i<unl?'#ffd166':'#6a6a80','center')}if(unl<5)tx('前のワールドをクリアすると次のワールドが解放されます',W/2,388,13,'#9aa0b8','center')}
  else{tx('全ステージクリア！',W/2,200,34,'#9be28f','center');tx('作者：……信用しすぎましたね。おめでとうございます。',W/2,250,18,'#f3efe6','center');tx('Enter / タップでタイトルへ',W/2,310,16,'#ffd166','center');shareBtn()}return}
 const cx=Math.max(0,Math.min(p.x-W/2,lv.w*T-W));
 g.save();g.translate(-Math.round(cx),0);
 g.fillStyle='#2a3160';for(let i=0;i<14;i++)g.fillRect(i*260-(cx*.3%260),150+(i%3)*40,120,H);
 lv.S.map(R).forEach(gnd);fk.forEach(f=>{if(!f.gone||f.y<H+80)gnd(f)});
 for(const k in lv.d){const o=lv.d[k];if(!dyn[k])continue;if(o.k==='so')gnd(R(o.r));else spikes(o.r[0],o.r[1],o.r[2],o.dn)}
 lv.sp.forEach(s=>spikes(s[0],s[1],s[2]));lv.fs.forEach(s=>spikes(s[0],s[1],s[2]));
 lv.fg.forEach(f=>door(f.x,f.y));door(lv.g[0],lv.g[1]);
 lv.sg.forEach(s=>{g.fillStyle='#6b4a2b';g.fillRect(s.x*T+14,s.y*T+16,4,16);g.fillStyle='#c89a5a';g.fillRect(s.x*T+2,s.y*T+2,28,18);g.fillStyle='#6b4a2b';g.fillRect(s.x*T+7,s.y*T+8,18,2);g.fillRect(s.x*T+7,s.y*T+13,12,2);
  if(Math.abs(p.x-s.x*T)<120){const w=g.measureText(s.t).width;g.font='bold 14px sans-serif';const ww=g.measureText(s.t).width+16;g.fillStyle='rgba(0,0,0,.75)';g.fillRect(s.x*T+16-ww/2,s.y*T-30,ww,24);tx(s.t,s.x*T+16,s.y*T-13,14,'#fff','center')}});
 lv.c.forEach((o,i)=>{if(!cs[i]){g.fillStyle='#ffd166';g.beginPath();g.arc(o.x*T+16,o.y*T+16,8,0,7);g.fill()}});
 if(dead<=0){g.fillStyle='#ffd166';g.fillRect(p.x,p.y,p.w,p.h);g.fillStyle='#222';g.fillRect(p.x+(p.face>0?12:4),p.y+7,4,5)}
 else{g.fillStyle='#ffd166';parts.forEach(q=>g.fillRect(q.x,q.y,6,6))}
 g.restore();
 tx('WORLD '+lv.n,12,24,16);tx('死亡 '+deaths+'　時間 '+time.toFixed(1)+'s',W-12,24,16,'#f3efe6','right');
 if(mt>0){g.fillStyle='rgba(0,0,0,.8)';g.fillRect(20,H-64,W-40,48);tx(msg.length>46?msg.slice(0,46)+'…':msg,W/2,H-34,17,'#ffd166','center')}
 if(st==='pause'){g.fillStyle='rgba(0,0,0,.7)';g.fillRect(0,0,W,H);tx('ポーズ中',W/2,210,40,'#fff','center');tx('Esc / Enter で再開',W/2,250,16,'#ffd166','center')}
 if(st==='clear'){g.fillStyle='rgba(0,0,0,.75)';g.fillRect(0,0,W,H);tx('STAGE CLEAR!',W/2,150,44,'#9be28f','center');
  tx('クリア時間 '+time.toFixed(2)+'s　死亡 '+deaths+'回　'+cl,W/2,205,20,'#fff','center');
  tx('作者：'+(deaths==0?'ノーミス……？ 信じられません。':deaths<5?'まあ、順当でしょう。':'お疲れさまでした。学びましたね？'),W/2,245,17,'#ffd166','center');tx('Enter / タップで次へ',W/2,300,16,'#fff','center');if(nw)tx(nw,W/2,345,24,'#9be28f','center');shareBtn()}
}
if(/^#[1-5]$/.test(location.hash))load(WS[+location.hash[1]-1]);
let last=performance.now();
(function loop(n){const dt=Math.min((n-last)/1000,.033);last=n;if(st==='play')upd(dt);draw();requestAnimationFrame(loop)})(last);
</script></body></html>
