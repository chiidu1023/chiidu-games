function addEff(m,k,v,t){m.eff=m.eff||[];m[k]=(m[k]||0)+v;m.eff.push({k,v,t})}
function dispelBuff(o,keys){let n=0;o.eff=(o.eff||[]).filter(e=>{if(e.v>0&&keys.includes(e.k)){o[e.k]-=e.v;n++;return false}return true});if(keys.includes('db')){if(o.tb){o.db-=o.tb.v;o.tb=null;n++}if(o.db>0){o.db=0;n++}if(o.td>0||o.df||o.gd){o.td=0;o.df=0;o.gd=0;n++}}if(keys.includes('ab')){if(o.ab>0){o.ab=0;n++}if(o.ta>0){o.ta=0;n++}}return n}
function shieldCut(op,d,og){if(d>=op.m.max*.25){const s=op.s.find(x=>(x.sk==='shield'||x.sk==='tgd')&&x.u>0);if(s){const K=SK[s.sk];s.u--;d=Math.max(1,Math.round(d*(1-K.a)));L(`${K.fx} ${og}${s.nm}の【${K.n}】発動！ダメージ軽減`)}}return d}
function ultSup(me,I,tg){const r={};for(const c in SUPC){const x=me.s.find(y=>SUPC[c].includes(y.sk));if(x){r[c]=x;I.sup.push(x.nm);L(`🤝 ${tg}${x.nm}が連携！`+({atk:'必殺技の威力+10%',def:'発動後の被ダメージ軽減',heal:'命中時にHP少量回復',foe:'命中時に相手の攻撃力ダウン'})[c])}}return r}
function zcHit(me,op,tg,og,mu,lbl,I){const m=me.m,o=op.m;let d=dmg(m,o,mu,0);if(o.df)d*=.5;d=shieldCut(op,Math.max(1,Math.round(d)),og);o.hp=Math.max(0,o.hp-d);gg(o,GG.hurt);L(`⚔ ${tg}${m.nm}の${lbl}！ ${og}${o.nm}に${d}ダメージ（残HP ${o.hp}/${o.max}）`);if(I){I.hits.push(d);I.total+=d}}
function zcFire(ds,as,dtg,atg){const m=ds.m;if(!m.zc||m.hp<=0||as.m.hp<=0)return;m.zc=0;const I={s:ds===B.p?'p':'e',nm:m.nm,em:m.em,U:m.U,hits:[],total:0,sup:[],counter:1};B.mute=1;try{zcHit(ds,as,dtg,atg,2,'ゼロカウンター',I)}finally{B.mute=0}B.q.push(I)}
function zcEnd(){B.mute=1;try{for(const[s,o,t,ot]of[[B.p,B.e,'','敵の'],[B.e,B.p,'敵の','']]){const m=s.m;if(m.zc&&m.hp>0&&o.m.hp>0){m.zc=0;const I={s:s===B.p?'p':'e',nm:m.nm,em:m.em,U:m.U,hits:[],total:0,sup:[],direct:1};zcHit(s,o,t,ot,1.2,'必殺・直接攻撃',I);B.q.push(I);if(o.m.hp<=0){B.ph='end';B.win=s===B.p;break}}}}finally{B.mute=0}}
function ult(me,op,tg,og,first){B.mute=1;try{ult0(me,op,tg,og,first)}finally{B.mute=0}}
function ult0(me,op,tg,og,first){const m=me.m,U=m.U,o=op.m,H=U.h||[U.m||1];m.gg=0;m.ul=B.turn;
const I={s:me===B.p?'p':'e',nm:m.nm,em:m.em,U,hits:[],total:0,sup:[]};
L(`🌟 ${tg}${m.nm}の必殺技【${U.n}】発動！`);const sp=ultSup(me,I,tg);
if(U.zc){if(first){m.zc=1;I.field=1;L(`🛡 ${tg}${m.nm}が防御フィールドを展開！次の攻撃を受け止めて反撃する`)}else zcHit(me,op,tg,og,1.2,'必殺・直接攻撃',I);B.q.push(I);return}
if(U.dispel&&dispelBuff(o,['db'])){I.note='防御強化を解除！';L(`💥 ${og}${o.nm}の防御強化を解除！`)}
if(o.dv){o.dv=0;if(Math.random()<(o.dvp||.5)){L(`💨 ${og}${o.nm}は必殺技をかわした！`);I.dodge=1;B.q.push(I);return}}
let pen=U.p||0;if(U.pe&&m.hp<=m.max*U.pe[0])pen+=U.pe[1];pen=Math.min(.9,pen);
let c=1;if(U.low&&m.hp<=m.max*U.low[0])c*=U.low[1];if(U.miss)c*=1+U.miss[1]*Math.min(1,(1-m.hp/m.max)/U.miss[0]);
if(U.foeLow&&o.hp<=o.max*U.foeLow[0])c*=U.foeLow[1];if(U.rv&&m.hp<o.hp)c*=U.rv;if(U.rv2&&m.hp<=m.max*.2)c*=U.rv2;
if(U.first&&first)c*=U.first;if(U.hc)c*=1+Math.min(U.hc[1],m.hitc||0)*U.hc[0];if(sp.atk)c*=1.1;
let zcf=0,ok=0;
for(let i=0;i<H.length&&o.hp>0;i++){let d=dmg(m,o,H[i],pen)*c;const last=i===H.length-1;
if(last&&H.length>1&&ok===H.length-1){if(U.lb)d*=1+U.lb+(U.lbLow&&m.hp<=m.max*U.lbLow[0]?U.lbLow[1]:0);if(U.all)d*=U.all}
if(o.df)d*=.5;if(first)d*=.9;if(o.tg)d*=1-o.tg;if(o.gd){o.gd=0;d*=.5}if(o.zc&&!zcf){d*=.3;zcf=1}
d=shieldCut(op,Math.max(1,Math.round(d)),og);o.hp=Math.max(0,o.hp-d);ok++;I.hits.push(d);I.total+=d;
L(`⚔ ${tg}${m.nm}の必殺技！ ${H.length>1?(i+1)+'HIT ':''}${og}${o.nm}に${d}ダメージ（残HP ${o.hp}/${o.max}）`)}
gg(o,GG.hurt);
if(o.hp>0){if(U.foe)U.foe.forEach(e=>addEff(o,e[0],e[1],e[2]));if(U.foeSpd)addEff(o,'spd',-Math.round((o.spd||50)*U.foeSpd[0]),2);if(sp.foe)addEff(o,'ab',-.1,1);
if(U.dispelAtk&&Math.random()<U.dispelAtk&&dispelBuff(o,['ab'])){I.note='攻撃力上昇を解除！';L(`💥 ${og}${o.nm}の攻撃力上昇を解除！`)}}
if(U.self)addEff(m,U.self[0],U.self[1],U.self[2]);
if(U.heal&&m.hp<=m.max*U.heal[0]){const h=Math.min(m.max-m.hp,Math.round(m.max*U.heal[1]));if(h>0){m.hp+=h;I.heal=h;L(`💚 ${tg}${m.nm}のHPが${h}回復！`)}}
if(sp.heal){const h=Math.min(m.max-m.hp,Math.round(m.max*.05));if(h>0){m.hp+=h;L(`💗 連携回復 HP+${h}`)}}
if(sp.def)addEff(m,'db',.15,1);
if(U.dv){m.dv=1;m.dvp=U.dv;L(`🌀 ${tg}${m.nm}は次の攻撃を回避しやすくなった`)}
B.q.push(I);if(zcf)zcFire(op,me,og,tg)}
function ULTBTN(){const m=B.p.m,U=m.U;if(!U)return'';const r=m.gg>=100;return`<button class="btn ult${r?' rdy':''}" style="margin-top:6px" ${r?'':'disabled'} onclick="doAct('ult')">🌟 ${U.n}${r?'':'（ゲージあと'+(100-Math.round(m.gg||0))+'%）'}</button>`}
function hpAnim(){if(view!=='battle'||!B||!document.querySelectorAll)return;requestAnimationFrame(()=>{document.querySelectorAll('.bar i[data-n]').forEach(e=>{e.style.width=e.dataset.n+'%'});if(B){B.p.m.ph=null;B.e.m.ph=null}})}
function playQ(){const q=B.q||[];B.q=[];const fin=()=>{B.lock=false;if(B.pendSE){sfx(B.pendSE);bgmStop();B.pendSE=null}bgmVol();go('battle')};
if(!q.length){fin();return}B.lock=true;let i=0;const next=()=>{if(i>=q.length)fin();else ultFx(q[i++],next)};next()}
function ultSnd(I,ph,i){if(!S.set.sfx)return;try{const A=audio();if(!A)return;const o=A.createGain();o.gain.value=.34*sv();o.connect(busOut(A));const t=A.currentTime+.01,p=I.U.snd;
if(ph==='charge'){tn(A,o,p==='rev'?70:80,t,p==='rev'?.35:.5,.55,'sawtooth',p==='rev'?110:220)}
else if(ph==='name'){(p==='rev'?[262]:[262,330,392,523]).forEach((f,k)=>tn(A,o,f,t+k*.09,.2,.35,'triangle'))}
else if(ph==='rush'){if(p==='fast'){ns(A,o,t,.25,.5,1200,1,'bandpass',5000);tn(A,o,1500,t,.12,.25,'square',2400);tn(A,o,1800,t+.1,.1,.2,'square',2800)}else if(p==='power'){ns(A,o,t,.3,.5,300,1,'lowpass',1800);tn(A,o,120,t,.3,.5,'sawtooth',300)}}
else if(ph==='hit'){ns(A,o,t,.14,.9,1500,.8,'bandpass');tn(A,o,p==='power'?130:200,t,.3,1,'sine',p==='power'?40:70);if(p==='power')tn(A,o,1100,t+.03,.4,.3,'triangle');if(p==='fast')tn(A,o,2200,t,.1,.25,'square')}
else if(ph==='fin'){tn(A,o,90,t,.5,1,'sine',30);if(p!=='fast')[523,784,1046,1568].forEach((f,k)=>tn(A,o,f,t+k*.04,.45,.35,'triangle'));else{tn(A,o,1760,t,.25,.3,'square');tn(A,o,2637,t+.05,.3,.2,'triangle')}ns(A,o,t,.2,.6,4000,1,'highpass')}
setTimeout(()=>{try{o.disconnect()}catch(e){}},2200)}catch(e){}}
function fxHit(el,a,c,i){const d=document.createElement('div');d.style.setProperty('--uc',c);
if(a==='slash'||a==='wind'){d.className='fxs '+a+(a==='slash'?' r'+(i%2):'');d.style.top=(a==='wind'?20+i*16:22+i*12)+'%'}
else if(a==='cross'){d.className='fxs cross';d.innerHTML='<i></i><i></i>'}
else if(a==='stars'){d.className='fxst';d.innerHTML=[0,1,2,3,4,5,6].map(k=>`<i style="--a:${k*51}deg"></i>`).join('')}
else{d.className='fxr';d.innerHTML='<i></i><i></i>'}
el.appendChild(d);setTimeout(()=>d.remove(),900)}
function ultFx(I,done){const el=$('#ult');if(!el||!el.style||!el.style.setProperty||!document.createElement){done();return}
const lk=I.U.look||{},c=lk.c||'#fff',sm=S.set.simple,k=(sm?.3:1)*(I.U.big?1.25:1),T=[];let fin=false;
const at=(ms,f)=>T.push(setTimeout(f,ms*k));
const end=()=>{if(fin)return;fin=true;T.forEach(clearTimeout);el.style.display='none';el.innerHTML='';el.className='';document.body.classList&&document.body.classList.remove('shk');bgDucked=false;bgmVol();done()};
el.style.setProperty('--uc',c);el.className='';
const nH=Math.max(1,I.hits.length),tH=1250+nH*330,tE=tH+1000;
el.innerHTML=`<div class="dim"></div><div class="ins">${I.em}</div><div class="nm">${I.counter?'カウンター！ ':''}${I.U.n}</div><div class="fl"></div><div class="dmg"></div><div class="sp"></div>`;el.style.display='block';el.onclick=end;
bgDucked=true;bgmVol();
at(0,()=>{el.classList.add('on');ultSnd(I,'charge')});
if(!sm)at(250,()=>el.classList.add('show'));
at(700,()=>{el.classList.add('nmz');ultSnd(I,'name')});
at(1250,()=>ultSnd(I,'rush'));
if(!I.dodge&&!I.field)for(let i=0;i<nH;i++)at(1300+i*330,()=>{if(!sm)fxHit(el,lk.a,c,i);ultSnd(I,'hit',i);if(I.hits.length>1){const h=document.createElement('div');h.className='ht';h.style.left=(25+Math.random()*45)+'%';h.style.top=(28+i*9)+'%';h.textContent=(i+1)+' HIT';el.appendChild(h)}});
at(tH,()=>{const f=el.querySelector('.fl'),d=el.querySelector('.dmg'),sp=el.querySelector('.sp');
if(!S.set.noflash&&!sm)f.classList.add('go');if(!S.set.noshake&&!sm)document.body.classList.add('shk');
d.textContent=I.dodge?'かわされた！':I.field?'防御フィールド展開！':I.total;d.classList.add('go');
sp.textContent=[I.note,I.heal?'HP+'+I.heal:'',I.sup.length?'🤝連携：'+I.sup.join('・'):''].filter(Boolean).join('　');ultSnd(I,'fin')});
at(tE,end)}

function seTest(){['jk','jw','hit','guard','chg','skill','sup','heal','dodge','win'].forEach((k,i)=>setTimeout(()=>sfx(k,k==='hit'?1:0),i*420))}
function bgmTest(th){if(!B||view!=='battle')bgmStart(th||'btl')}
function zf(k,v){S.zf[k]=v;go('zukan')}
function detail(id){const s=SP[id],r=S.seen[id];
 $('#modal').innerHTML=`<div class="modal" onclick="if(event.target===this)this.parentNode.innerHTML=''"><div class="rar${s.rar}"><div class="hero">${ic(s)}<div><b>${r?s.ja:'？？？'}</b> <span class="tag">${RN[s.rar]}</span><br><small>${r?s.sci:'未捕獲'}</small></div></div>
 ${r?`<div class="card">${s.desc}</div><div class="card"><div class="line"><span>分類</span><span>${CL[s.cls]}</span></div><div class="line"><span>参考体長</span><span>約${s.min}〜${s.max}mm<br><small>${s.src?'出典：'+s.src:'※概数（未照合）'}</small></span></div><div class="line"><span>生息地</span><span>${s.hab}</span></div><div class="line"><span>活動時期</span><span>${s.sea}</span></div>
 <div class="line"><span>累計捕獲数</span><b>${r.n}体</b></div><div class="line"><span>最大／最小サイズ</span><span>${r.max}mm／${r.min}mm</span></div><div class="line"><span>初捕獲</span><span>${new Date(r.first).toLocaleString('ja-JP')}</span></div></div>`:`<div class="card">分類：${CL[s.cls]}<br>捕まえると詳細が見られます。</div>`}
 <button class="btn sub" onclick="this.closest('.modal').parentNode.innerHTML=''">閉じる</button></div></div>`}

 if(v==='bush'){const b=$('#bush');b.addEventListener('pointerdown',e=>{e.preventDefault();catchOne()});b.addEventListener('keydown',e=>{if(e.key===' '||e.key==='Enter'){e.preventDefault();catchOne()}})}
 if(v==='set'){let a=0;$('#rs').onclick=function(){if(!a){a=1;this.textContent='もう一度押すと全データを削除します'}else{S=fresh();flush();go('home')}}}
 if(v!=='bush')NEWSP=null;bgmCtl();hpAnim();if(v==='bush')renderNew();scrollTo(0,0)}
go('home');if(S.pend.length){lock=true;showResult()}
